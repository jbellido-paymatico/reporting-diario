<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f0e8">
  <title>Reporting diario</title>
  <link rel="stylesheet" href="styles.css">
  <script src="reportes.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app" data-report-app>
    <div class="top-region">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="Ir al reporte más reciente">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 3.75h9.25L19 7.5v12.75H6z"/><path d="M15 3.75V7.5h4M9 11h7M9 14.5h7M9 18h4"/></svg>
          </span>
          <span><strong>Reporting</strong><small>Resumen diario</small></span>
        </a>
        <div class="header-meta"><span class="live-dot" aria-hidden="true"></span><span data-report-count>0 reportes</span></div>
      </header>
      <div class="missing-today" data-missing-today role="status" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5m0 3.2v.1M10.3 3.9 2.7 17.1A2 2 0 0 0 4.4 20h15.2a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <strong>FALTA REPORTE DE HOY</strong>
        <span>Estás viendo el último reporte disponible.</span>
      </div>
    </div>

    <div class="app-shell">
      <aside class="archive-panel" aria-label="Archivo de reportes">
        <div class="archive-heading">
          <div><span class="eyebrow">HISTÓRICO</span><h2>Archivo</h2></div>
          <span class="archive-icon" aria-hidden="true">↘</span>
        </div>
        <label class="date-field">
          <span>Ir a una fecha</span>
          <span class="date-control">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v3m12-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></svg>
            <input type="date" data-date-input aria-label="Seleccionar fecha del reporte">
          </span>
        </label>
        <nav class="day-list" data-day-list aria-label="Reportes disponibles"></nav>
        <p class="archive-note">Los nuevos resúmenes aparecerán aquí tras la actualización diaria.</p>
      </aside>

      <main class="report-workspace">
        <div class="report-heading">
          <div><p class="eyebrow accent" data-report-kicker>REPORTE SELECCIONADO</p><h1 data-report-date>Reporting diario</h1></div>
          <span class="report-type">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>
            Resumen matutino
          </span>
        </div>
        <article class="report-card" data-report-content aria-live="polite"></article>
        <section class="empty-state" data-empty-state hidden>
          <span class="empty-mark" aria-hidden="true">—</span>
          <h2 data-empty-title>Reporte no encontrado</h2>
          <p data-empty-copy></p>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
